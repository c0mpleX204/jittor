data_name: &data_name models/model_normalized.obj
loader: &loader obj

train_dataset:
  shuffle: True
  batch_size: 1
  num_workers: 0
  datapath:
    input_dataset_dir: /root/autodl-tmp/dataset_train
    use_prob: True
    num_files: 3000
    loader: *loader
    data_name: *data_name
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/train.txt, 1.0],
      ]
